<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop Interview Notes</title>
<meta name="theme-color" content="#8a2b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shop Notes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]:not([hidden=until-found i]){display:none!important}
img{max-width:100%}
:root{--bg:#faf7f2;--panel:#fff;--ink:#2a2420;--ink2:#6b5f56;--line:#e6ddd2;--accent:#8a2b2b;--accent-ink:#fff;--soft:#f3ebe1;--ok:#2f6b3f;--warn:#9a6a12;--star:#c98a14;--focus:#8a2b2b33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1613;--panel:#241e1a;--ink:#f1e9e0;--ink2:#a89b8f;--line:#3a312b;--accent:#e08a7a;--accent-ink:#1a1613;--soft:#2d2520;--ok:#7fc08e;--warn:#e0b25a;--star:#e3ae45;--focus:#e08a7a44;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1613;--panel:#241e1a;--ink:#f1e9e0;--ink2:#a89b8f;--line:#3a312b;--accent:#e08a7a;--accent-ink:#1a1613;--soft:#2d2520;--ok:#7fc08e;--warn:#e0b25a;--star:#e3ae45;--focus:#e08a7a44;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;margin:0;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
.ne{font-family:"Noto Sans Devanagari",Inter,sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
button.on{background:var(--soft);border-color:var(--accent)}
button.danger:hover{color:#b3261e;border-color:#b3261e}
input,textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}
textarea{resize:none;overflow:hidden;min-height:68px;line-height:1.5}
.wrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;max-width:1200px;margin:0 auto}
aside{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:16px 0}
aside h2{font:600 20px Fraunces,Georgia,serif;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.it{display:block;width:100%;text-align:left;padding:9px 11px}
.it b{display:block;font-weight:600;overflow-wrap:anywhere}
.it small{color:var(--ink2)}
.it.cur{border-color:var(--accent);background:var(--soft)}
main{min-width:0;padding-bottom:40px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.bar .row{justify-content:space-between}
.status{color:var(--ink2);font-size:13px}.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}
.prog{height:4px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);width:0}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.nav button{padding:3px 10px;font-size:13px;border-radius:99px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.l{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
h3.sec{font:600 22px Fraunces,Georgia,serif;margin:30px 0 4px;scroll-margin-top:110px}
.intro{color:var(--ink2);margin:0 0 4px}
.listen{background:var(--soft);border-radius:8px;padding:8px 12px;font-size:13.5px;margin-top:10px}
.q{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
.qt{display:flex;gap:10px}
.num{flex:none;min-width:34px;height:26px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:600;padding:0 6px}
.num.star{color:var(--star)}
.qt p{margin:0}.qt .ne{font-weight:700;color:var(--ink2);font-size:17px;line-height:1.6;margin-top:3px}.qt .ne.main{color:var(--ink);font-size:19px;margin-top:0}
.done .num{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;margin-bottom:8px}.chips button{padding:4px 12px}
.price{display:flex;align-items:center;gap:8px;margin-bottom:8px;max-width:220px}.price span{color:var(--ink2)}
table{border-collapse:collapse;width:100%;margin-top:10px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
td select{width:90px}
.tw{overflow-x:auto}
.hide{display:none!important}
.q.skip{display:none}
.hint{font-size:13px;color:var(--ink2)}
.ans{display:flex;gap:10px;align-items:flex-start}
.opts{display:flex;flex-direction:column;gap:6px;flex:none;width:230px}
.opt .ne{display:block;font-size:14px;line-height:1.4;margin-top:2px;font-weight:500}
.opt{text-align:left;padding:6px 10px;font-size:13.5px;line-height:1.3}
.opt.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.ans textarea{flex:1;min-width:0}
.ne.hint{font-size:16px}
button:disabled,input:disabled,textarea:disabled,select:disabled{cursor:not-allowed}
input:disabled,textarea:disabled,select:disabled{background:var(--soft)}
.opt:disabled:not(.on){opacity:.55}
h3.sec.ne{font-family:"Noto Sans Devanagari",Fraunces,serif;font-weight:500}
.intro.ne,.listen.ne{font-size:16px;line-height:1.65}
body.lang-ne{font-family:"Noto Sans Devanagari",Inter,system-ui,sans-serif;font-size:16px}
.lang-ne .opt{font-size:15px}.lang-ne .hint{font-size:15px}.lang-ne label.l{text-transform:none;font-size:13px}
.hint.warn{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:9}
@media(max-width:860px){.wrap{grid-template-columns:minmax(0,1fr);gap:0}aside{position:static;max-height:none}#list{max-height:240px;overflow:auto}.q{grid-template-columns:minmax(0,1fr);gap:10px}.ans{flex-direction:column;align-items:stretch}.opts{width:auto;flex-direction:row;flex-wrap:wrap}}
</style>
</head><body>
<div class="wrap">
<aside>
 <h2 id="h-int">Interviews</h2>
 <div class="row"><button class="pri" id="new">+ New interview</button><button id="csv">Export all (CSV)</button></div>
 <div class="row" style="margin-top:6px"><button id="bak">Backup</button><button id="rst">Restore</button><input type="file" id="rstf" accept=".json,application/json" hidden></div>
 <input id="search" type="search" placeholder="Search shop, area, name…" style="margin-top:10px" aria-label="Search interviews">
 <div class="hint" id="count" style="margin-top:8px"></div>
 <div class="hint" id="bk" style="margin-top:4px"></div>
 <div id="list"></div>
</aside>
<main>
 <div class="bar">
  <div class="row">
   <div><b id="title">New interview</b> <span class="status" id="status"></span></div>
   <div class="row">
    <button id="starOnly" title="Show only the ★ questions (for when time is short)">★ only</button>
    <button id="md">Download this shop</button>
    <button class="pri" id="save">Save now</button>
   </div>
  </div>
  <div class="prog"><i id="bar"></i></div>
  <div class="hint" id="pc" style="margin-top:4px"></div>
  <div class="nav" id="nav"></div>
 </div>
 <div id="form"></div>
</main>
</div>
<div class="toast hide" id="toast"></div>
<script>

const GUIDE={"sections": [{"t": "About the shop", "intro": "These six answers tell you the size of the shop and whether VAT is likely to matter to them.", "listen": "Shops selling over about Rs 4 lakh a month are near the Rs 50 lakh a year VAT limit. They are a different customer from a one-person corner shop.", "qs": [{"n": 1, "star": false, "en": "What do you sell, and how long have you run this shop?", "ne": "तपाईंको पसलमा के के बेच्नुहुन्छ, र कति वर्षदेखि चलाउनुभएको छ?", "kind": ""}, {"n": 2, "star": false, "en": "Who works here besides you? Who sits at the counter?", "ne": "तपाईंबाहेक पसलमा को को काम गर्छन्? काउन्टरमा को बस्छ?", "kind": ""}, {"n": 3, "star": true, "en": "About how many customers come on a normal day, and on a busy day?", "ne": "सामान्य दिन र व्यस्त दिनमा करिब कति ग्राहक आउँछन्?", "kind": ""}, {"n": 4, "star": false, "en": "Roughly how many different items do you keep?", "ne": "करिब कति थरी सामान राख्नुहुन्छ?", "kind": ""}, {"n": 5, "star": false, "en": "Roughly how much do you sell in a month? (optional: under Rs 1 lakh / 1–3 lakh / 3–5 lakh / over 5 lakh)", "ne": "महिनामा करिब कति बिक्री हुन्छ? (भन्न मन नलागे छोडौं—१ लाख भन्दा कम / १–३ लाख / ३–५ लाख / ५ लाख भन्दा बढी)", "kind": ""}, {"n": 6, "star": false, "en": "Is the shop registered for PAN? Do you give PAN or VAT bills?", "ne": "पसल PAN मा दर्ता छ? PAN वा VAT बिल दिनुहुन्छ?", "kind": ""}]}, {"t": "How the shop runs today", "intro": "Ask them to show you, not just tell you. Watching them work at the counter is worth more than the answers.", "listen": "Every place they use paper, memory or a calculator. Each one is a possible job for the system, and each one shows how much work they already do by hand.", "qs": [{"n": 7, "star": true, "en": "Walk me through your last sale, from the customer picking an item to the money. How do you work out the total? (calculator, notebook, memory, computer)", "ne": "पछिल्लो बिक्री सुरुदेखि अन्त्यसम्म कसरी भयो देखाइदिनुस्। जम्मा कसरी हिसाब गर्नुहुन्छ? (क्यालकुलेटर, कपी, मनमा, कम्प्युटर)", "kind": ""}, {"n": 8, "star": false, "en": "Do you give customers a bill or receipt? How? Do customers ask for one?", "ne": "ग्राहकलाई बिल वा रसिद दिनुहुन्छ? कसरी? ग्राहकले माग्छन्?", "kind": ""}, {"n": 9, "star": true, "en": "How do you know what is in stock? How do you know something is running low?", "ne": "कुन सामान कति बाँकी छ भनेर कसरी थाहा पाउनुहुन्छ? सकिन लाग्यो भनेर कसरी थाहा हुन्छ?", "kind": ""}, {"n": 10, "star": false, "en": "How do you decide what to order and when? Who do you order from, and how? (phone, visit, they visit you)", "ne": "के कति र कहिले मगाउने भन्ने कसरी निर्णय गर्नुहुन्छ? कसबाट र कसरी मगाउनुहुन्छ? (फोन, आफैँ गएर, सप्लायर आउँछ)", "kind": ""}, {"n": 11, "star": false, "en": "How do you handle expiry dates?", "ne": "म्याद सकिने सामानको हेरचाह कसरी गर्नुहुन्छ?", "kind": ""}, {"n": 12, "star": true, "en": "Do you sell on credit (udharo)? How do you write it down? How many customers, and roughly how much is owed to you right now?", "ne": "उधारो बेच्नुहुन्छ? कसरी लेख्नुहुन्छ? कति जना ग्राहकलाई, र अहिले करिब कति बाँकी छ?", "kind": ""}, {"n": 13, "star": false, "en": "How do customers pay: cash, eSewa, Fonepay? Roughly what share each?", "ne": "ग्राहकले कसरी तिर्छन्—नगद, eSewa, Fonepay? करिब कति कति प्रतिशत?", "kind": ""}, {"n": 14, "star": false, "en": "How do you check that an eSewa or Fonepay payment really arrived?", "ne": "eSewa वा Fonepay पैसा साँच्चै आयो भनेर कसरी जाँच्नुहुन्छ?", "kind": ""}, {"n": 15, "star": false, "en": "What do you do at the end of the day: count cash, check sales, write anything down? How long does it take?", "ne": "दिनको अन्त्यमा के गर्नुहुन्छ—नगद गन्ने, बिक्री हेर्ने, लेख्ने? कति समय लाग्छ?", "kind": ""}, {"n": 16, "star": false, "en": "Who does your accounts and tax papers? Do you use an accountant?", "ne": "हिसाबकिताब र कर सम्बन्धी कागज को गर्छ? लेखापाल राख्नुहुन्छ?", "kind": ""}]}, {"t": "Pain points", "intro": "This is the most important section. Ask for the last real event each time, then ask “what did that cost you?” in rupees or hours.", "listen": "A pain they bring up without being asked, and one that cost real money or hours. Write the number down. “It is annoying” is weak; “I lose about Rs 3,000 a month on expired biscuits” is strong.", "qs": [{"n": 17, "star": true, "en": "What is the hardest or most annoying part of running the shop?", "ne": "पसल चलाउँदा सबैभन्दा गाह्रो वा झन्झटिलो कुरा के हो?", "kind": ""}, {"n": 18, "star": true, "en": "Tell me about the last time you lost money or time because of a mistake. What happened? (wrong change, forgotten credit, item ran out, expired stock)", "ne": "पछिल्लोपटक गल्तीले पैसा वा समय गुमाएको घटना भन्नुस्। के भयो? (फिर्ता पैसा गलत, उधारो बिर्सिएको, सामान सकिएको, म्याद सकिएको)", "kind": ""}, {"n": 19, "star": false, "en": "How often does something sell out before you can reorder? What do you lose when that happens?", "ne": "कति पटक सामान सकिएर बिक्री छुट्छ? त्यसबेला के गुमाउनुहुन्छ?", "kind": ""}, {"n": 20, "star": false, "en": "In a month, how much stock do you throw away or sell cheaply because it expired or got damaged?", "ne": "म्याद सकिएर वा बिग्रेर महिनामा कति सामान फाल्नुपर्छ वा सस्तोमा बेच्नुपर्छ?", "kind": ""}, {"n": 21, "star": false, "en": "Do you ever feel stock or cash goes missing and you cannot explain it?", "ne": "कहिले सामान वा पैसा हराएजस्तो लाग्छ तर कारण थाहा हुँदैन?", "kind": ""}, {"n": 22, "star": false, "en": "Of the credit you give, how much is hard to collect?", "ne": "दिएको उधारोमध्ये कति असुल गर्न गाह्रो हुन्छ?", "kind": ""}, {"n": 23, "star": false, "en": "How many hours a week do you spend on counting, writing, ordering and accounts?", "ne": "हप्तामा गन्ती, लेखपढ, अर्डर र हिसाबमा कति घण्टा खर्चिन्छ?", "kind": ""}, {"n": 24, "star": true, "en": "If you could fix one thing in your shop tomorrow, what would it be?", "ne": "भोलि पसलको एउटा कुरा मात्र ठीक गर्न मिल्थ्यो भने के गर्नुहुन्थ्यो?", "kind": ""}]}, {"t": "Tools and technology", "intro": "This tells you what the system must run on, and why earlier software failed for them.", "listen": "Why they stopped using software before. The answer (too slow, too hard, too costly, no help when it broke) is what you must not repeat.", "qs": [{"n": 25, "star": false, "en": "What do you use now: notebook, calculator, phone, computer, any billing app?", "ne": "अहिले के प्रयोग गर्नुहुन्छ—कपी, क्यालकुलेटर, मोबाइल, कम्प्युटर, कुनै बिलिङ एप?", "kind": ""}, {"n": 26, "star": true, "en": "Have you ever tried billing or stock software or an app? What did you like? Why did you stop?", "ne": "कहिल्यै कुनै बिलिङ वा स्टक सफ्टवेयर वा एप चलाउनुभएको छ? के मन पर्‍यो? किन छोड्नुभयो?", "kind": ""}, {"n": 27, "star": false, "en": "Do you have a computer, tablet or touchscreen at the counter? A receipt printer? A barcode scanner?", "ne": "काउन्टरमा कम्प्युटर, ट्याब्लेट वा टचस्क्रिन छ? रसिद प्रिन्टर? बारकोड स्क्यानर?", "kind": ""}, {"n": 28, "star": false, "en": "How reliable are your internet and electricity? What do you do during a power cut?", "ne": "इन्टरनेट र बिजुली कत्तिको भरपर्दो छ? बिजुली गएको बेला के गर्नुहुन्छ?", "kind": ""}, {"n": 29, "star": false, "en": "Who would use a system at your counter? How comfortable are they with phones and computers? Nepali or English?", "ne": "काउन्टरमा को चलाउँछ? फोन वा कम्प्युटरमा कत्तिको सहज छन्? नेपाली कि अंग्रेजी?", "kind": ""}, {"n": 30, "star": false, "en": "Do most of your items have barcodes? Would you rather scan them or tap a picture on the screen?", "ne": "धेरै सामानमा बारकोड छ? स्क्यान गर्न चाहनुहुन्छ कि स्क्रिनमा फोटो छोएर बिक्री गर्न?", "kind": ""}]}, {"t": "Price", "intro": "Ask 31 first. Then read the one-sentence description aloud, exactly as written, and ask the four price questions in order (32–35). Write down a number for each; do not nudge them.", "listen": "Do not tell the shopkeeper any number first. The four answers together show the range of prices shops accept, from “good deal” up to “getting expensive”.", "qs": [{"n": 31, "star": true, "en": "W async function initStore(){
 let db=null;
 if(db){
  const col=db.collection('interviews');
  store={kind:'db',put:(c)=>col.doc(c.id).set(c),del:(id)=>col.doc(id).delete(),
   watch:(cb)=>col.limit(1000).onSnapshot(s=>cb(s.docs.map(d=>d.data())),()=>{})};
 }else{
  let m={};try{m=JSON.parse(lsGet('kn-all')||'{}')}catch(e){}
  let cb=()=>{};
  store={kind:'local',put:async c=>{m[c.id]=c;lsSet('kn-all',JSON.stringify(m));cb(Object.values(m))},del:async id=>{delete m[id];lsSet('kn-all',JSON.stringify(m));cb(Object.values(m))},
   watch:f=>{cb=f;f(Object.values(m))}};

}

/* ---------- saving ---------- */
function setStatus(t,c){const s=$('#status');s.textContent=t;s.className='status '+(c||'')}

function save(){
 clearTimeout(timer);
 if(readOnly)return saving;
 if(!dirty&&cur.updated)return saving;
 if(!cur.shop.trim()){setStatus(u('needName'),'warn');return saving}
 if(!store){setStatus('Starting…','warn');return saving}
 cur.updated=Date.now();dirty=false;lsSet('kn-draft',JSON.stringify(cur));
 const snap=JSON.parse(JSON.stringify(cur));
 saving=saving.then(()=>store.put(snap)).then(()=>{if(!dirty)setStatus(u('savedAt')+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),'ok')}).catch(e=>{dirty=true;setStatus('Could not save — will retry. Your text is kept on this iPad.','warn');timer=setTimeout(save,5000)});
 return saving;
}

async function openItem(c){if(c.id===cur.id)return;await flush();cur=JSON.parse(JSON.stringify(c));cur.a=cur.a||{};cur.o=cur.o||{};cur.f=cur.f||{};dirty=false;readOnly=true;lsSet('kn-draft','');renderForm();setStatus(u('roStatus'),'ok');renderList();scrollTo({top:0})}
async function flush(){if(dirty&&cur.shop.trim())await save()}
async function newItem(){await flush();cur=blank();readOnly=false;dirty=false;lsSet('kn-draft',JSON.stringify(cur));renderForm();setStatus('');renderList();scrollTo({top:0});setTimeout(()=>$('#f-shop').focus(),50)}

/* ---------- export ---------- */
function clean(s){return String(s||'').replace(/[\\/:*?"<>|\r\n]+/g,' ').replace(/\s+/g,' ').trim()}
function toMd(c){
 const L=['# '+(c.shop||'Shop')+(c.area?' — '+c.area:''),'','- Date: '+c.date,'- Shopkeeper: '+(c.person||'—'),'- Phone: '+(c.phone||'—'),'- Notes taken by: '+(c.who||'—'),'- Free trial (Q42): '+(c.trial||'—'),''];
 GUIDE.sections.forEach(s=>{
  L.push('## '+s.t,'');
  if(s.feat){L.push('Features I need:');const nd=GUIDE.features.filter((f,i)=>((c.f||{})[i]||{}).need);nd.forEach(f=>L.push('- '+f.en));if(!nd.length)L.push('- (none marked)');L.push('')}
  s.qs.forEach(q=>{L.push('**'+QN[q.n]+(q.star?' ★':'')+'. '+q.en+'**');const p=(c.a||{})['p'+q.n];if(p)L.push('Rs '+p+' per month');const ch=(c.o||{})[q.n];if(ch)L.push('Answer: '+ch);L.push(String((c.a||{})[q.n]||'').trim()||(ch?'':'—'),'')});
 });
 L.push('## General notes','',(c.general||'').trim()||'—','');return L.join('\n');
}
function csvCell(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCsv(arr){
 const qs=GUIDE.sections.flatMap(s=>s.qs);
 const head=['Shop','Area','Date','Shopkeeper','Phone','Notes by','Free trial (Q42)',...qs.flatMap(q=>[...(q.kind==='price'?['Q'+QN[q.n]+' Rs']:[]),...(OPTS[q.n]?['Q'+QN[q.n]+' '+q.en.slice(0,40)+' (choice)','Q'+QN[q.n]+' notes']:['Q'+QN[q.n]+' '+q.en.slice(0,40)])]),'Features I need','General notes'];
 const rows=arr.map(c=>{
  const top=Object.entries(c.f||{}).filter(()=>false).join('; ');
  const nev=Object.entries(c.f||{}).filter(([,x])=>x.need).map(([i])=>GUIDE.features[i].en).join('; ');
  return [c.shop,c.area,c.date,c.person,c.phone,c.who,c.trial,...qs.flatMap(q=>[...(q.kind==='price'?[(c.a||{})['p'+q.n]||'']:[]),...(OPTS[q.n]?[(c.o||{})[q.n]||'']:[]),(c.a||{})[q.n]||'']),nev,c.general];
 });
 return '﻿'+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');
}
async function download(filename,data){
 const type=/\.csv$/.test(filename)?'text/csv;charset=utf-8':/\.json$/.test(filename)?'application/json':'text/markdown;charset=utf-8';
 const blob=new Blob([data],{type});
 let done=false;
 try{
  const file=new File([blob],filename,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});done=true}
 }catch(e){if(e&&e.name==='AbortError')return}
 if(!done){
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);done=true}
  catch(e){toast('Could not save the file');return}
 }
 toast('Saved '+filename);
 if(/\.(csv|json)$/.test(filename)){lsSet('kn-bk',DAY());updateBk()}
}
function updateBk(){const e=$('#bk');if(!e)return;const d=lsGet('kn-bk');e.textContent=d?'Last backup: '+d:'No backup yet';e.className='hint'+(items.length&&d!==DAY()?' warn':'')}

/* ---------- wire up ---------- */
function applyLang(){
 document.body.classList.toggle('lang-ne',lang==='ne');document.documentElement.lang=lang==='ne'?'ne':'en';
 $('#h-int').textContent=u('interviews');$('#new').textContent=u('newInt');$('#csv').textContent=u('csv');
 $('#search').placeholder=u('search');$('#starOnly').textContent=u('starOnly');$('#md').textContent=u('md');$('#save').textContent=u('save');
 renderForm();renderList();
}
$('#new').addEventListener('click',newItem);
$('#save').addEventListener('click',async()=>{if(readOnly)return;dirty=true;await save();if(cur.shop.trim())toast(u('savedToast'))});
$('#search').addEventListener('input',renderList);
$('#starOnly').addEventListener('click',()=>{starOnly=!starOnly;applyStar()});
$('#md').addEventListener('click',()=>{if(!cur.shop.trim()){toast(u('needNameToast'));return}download(clean(cur.shop)+' - '+cur.date+'.md',toMd(cur))});
$('#csv').addEventListener('click',()=>{if(!items.length){toast(u('nothingToast'));return}download('Kirana interviews - all shops - '+DAY()+'.csv',toCsv(items.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''))))});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(readOnly)return;dirty=true;save()}});
addEventListener('pagehide',()=>{if(dirty)lsSet('kn-draft',JSON.stringify(cur))});
$('#bak').addEventListener('click',async()=>{await flush();if(!items.length){toast('Nothing saved yet');return}download('Kirana interviews backup - '+DAY()+'.json',JSON.stringify({app:'kirana-interviews',v:1,items}))});
$('#rst').addEventListener('click',()=>$('#rstf').click());
$('#rstf').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const j=JSON.parse(await f.text());const arr=Array.isArray(j)?j:(j.items||[]);let n=0;
  for(const c of arr){if(!c||!c.id)continue;const have=items.find(x=>x.id===c.id);if(!have||(c.updated||0)>(have.updated||0)){await store.put(c);n++}}
  toast(n+' interview'+(n===1?'':'s')+' restored')}catch(err){toast('Could not read that backup file')}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(async()=>{
 const d=lsGet('kn-draft');if(d){try{const c=JSON.parse(d);if(c&&c.id&&(c.shop||answered(c)||c.general)){cur=Object.assign(blank(),c);dirty=!!cur.shop.trim()}}catch(e){}}
 applyLang();
 await initStore();
 if(dirty){setStatus('Restored unsaved notes — saving…');save()}
})();
</script>
</body></html>
